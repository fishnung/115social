name: 發布學生網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得網站原始碼
        uses: actions/checkout@v4
      - name: 準備 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 準備 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: 安裝套件
        run: pnpm install --frozen-lockfile
      - name: 建立 GitHub Pages 網站
        run: pnpm run build:pages
      - name: 上傳網站檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 發布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
